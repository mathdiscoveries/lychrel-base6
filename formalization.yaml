# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Two infinite families of base-6 Lychrel numbers"
  description: >-
    Unconditional Lean 4 formalization of two explicit, strictly increasing,
    pairwise disjoint infinite families x(m) and y(m) (m >= 0) of base-6
    Lychrel numbers under repeated base-6 reverse-and-add T(n) = n + rev_6(n).
    Family 1 has 110 + 2m base-6 digits (smallest seed x(0) with 86 decimal
    digits) and Family 2 has 108 + 2m base-6 digits (smallest seed y(0) with
    84 decimal digits), with middle blocks linked by base-6 digit complement d
    |-> 5 - d. Both satisfy the exact period-12 self-similar recurrence
    T^[12](x(m)) = x(m + 3) and T^[12](y(m)) = y(m + 3) while avoiding all
    base-6 palindromes, proving unconditionally that infinitely many base-6
    Lychrel numbers exist. Coverage by this package's Palomar comparison: of
    the companion paper's 10 main results, 2 are compared in Lean in full
    (20%; Theorems 1 and 2) and 2 in part (Corollary 3: every x(m) and y(m) is
    a base-6 Lychrel number, without its positivity and per-iterate form;
    Theorem 7: the two families are disjoint, without the injectivity of all
    six forward trajectories); 5 more (Lemma 4, Theorem 5, Proposition 6,
    Theorem 8 and Corollary 9) are proved in this package's Lean library but
    not compared, though the compared statements include the infinitude of
    base-6 Lychrel numbers; Proposition 10 is by certificate only; Conjecture
    11 is open and not counted.
  authors:
    - "Tyler B. Hughes"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Tyler B. Hughes"

classification:
  arxiv:
    - "math.NT"
  msc2020:
    - "11A63"
    - "11B37"

sources:
  - title: "Two Infinite Families of Base-6 Lychrel Numbers: Carry Proofs and Six-Orbit Counts"
    authors:
      - "Tyler B. Hughes"
    id: "https://mathdiscoveries.org/results/lychrel-base-6-families"
    type: "paper"
    location: "https://mathdiscoveries.org/results/lychrel-base-6-families"
    relationship: "formalizes"
    note: >-
      The companion paper. It states and proves in writing every compared
      statement of this package (Theorems 1, 2 and 7, Corollaries 3 and 9, and
      the values of x(0) and y(0) in Section 1; strict monotonicity of each
      family is read off from the digit lengths 110 + 2m and 108 + 2m in its
      definitions (1) and (2)), and the Lean work formalizes them; the
      formalization presents no result that the paper does not. The external
      sweep and search that found the center word (Proposition 10) are not
      part of this package, and no proof here depends on them. Neither family
      was found in the literature searches logged (reference works, OEIS
      A060382, arXiv, academic indexes, code repositories, and a 5-query
      Google Scholar sweep on 2026-11-22), with medium confidence, since
      October 2026 community postings and informal or subscription channels
      were not searched exhaustively. AI research agents built and directed by
      Tyler B. Hughes generated and checked this work. No human mathematician
      has yet refereed the proof.
    author_endorsement: "participated"
  - title: "dew-web/lychrel-self-similar"
    authors:
      - "Y. Kusayama"
    id: "https://github.com/dew-web/lychrel-self-similar"
    type: "other"
    relationship: "background"
    note: >-
      Finite-state carry-automaton formulation whose October 2026 search
      reached the two base-6 period-12 cases up to 16,777,216 states
      ("CAPACITY EXCEEDED (inconclusive)"); our search reimplemented the
      method from its written description and located the center at
      287,670,768 states.
    author_endorsement: "not-contacted"
  - title: "Sporadic solutions for reverse-sum iterations"
    authors:
      - "David Seal"
    id: "https://www.mathpages.com/home/dseal.htm"
    type: "web discussion"
    location: "Usenet rec.puzzles (January 1996), archived on MathPages"
    relationship: "background"
    author_endorsement: "n/a"
  - title: "OEIS A060382: Smallest Lychrel number in base n"
    id: "https://oeis.org/A060382"
    type: "web discussion"
    relationship: "background"
    author_endorsement: "n/a"

related_formalizations: []

status:
  scope: >-
    Complete unconditional proof of the existence of infinitely many base-6
    Lychrel numbers via both explicit period-12 families x(m) and y(m),
    including the carry-automaton soundness engine (Lemma C and Lemma S),
    direct kernel verification for small indices m in {0..5}, strict
    monotonicity, pairwise disjointness, exact base-10 seed identities, and
    complement duality/orbit structure in LychrelBase6.DualityAndCounting.
    Does not resolve whether smaller base-6 Lychrel suspects (such as the
    smallest conjectured base-6 seed) are Lychrel.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Quot.sound"
    - "Classical.choice"

automation:
  methods:
    - method: "agent"
      models:
        - "Claude Opus"
        - "GPT-5"
      framework: "Multi-agent research and Lean formalization system built and directed by Tyler B. Hughes"
      tool_setup: >-
        Independent reimplementation of the finite-state carry-automaton search
        in compiled code to find the period-12 base-6 templates, followed by
        agent-authored Lean 4.35 / Mathlib formalization and independent
        falsifier/reviewer audits.
  notes: >-
    Tyler B. Hughes built, configured, and directed the research and verification
    agents and takes maintainer responsibility for the formalization.

review:
  status: "agent-reviewed"
  notes: >-
    Checked with Lean 4.35.0 kernel build, full #print axioms audit
    (LychrelBase6/Verify.lean; zero sorry, zero native_decide), and
    independent Python exact-arithmetic replay of the 12-step orbits. No human
    mathematician has yet refereed the proof.

alignment:
  namespace: "LychrelBase6"
  statements:
    - source: "There are infinitely many base-6 Lychrel numbers (the abstract's two infinite families; from Corollary 3 and the digit lengths in definitions (1) and (2))"
      lean: "LychrelBase6.infinite_lychrel6"
      module: "Challenge"
      status: proved
      note: "The set of base-6 Lychrel numbers is infinite."
    - source: "Corollary 3, Family x(m): every x(m) is a base-6 Lychrel number"
      lean: "LychrelBase6.xValue_lychrel"
      module: "Challenge"
      status: proved
      note: "Compared without Corollary 3's positivity clause and its form for every forward iterate of the six seeds."
    - source: "Theorem 1: T^12(x(m)) = x(m + 3) for every m >= 0"
      lean: "LychrelBase6.xValue_step12"
      module: "Challenge"
      status: proved
      note: "The period-12 return of Theorem 1; its non-palindromicity half follows from LychrelBase6.xValue_lychrel."
    - source: "Family x(m) is strictly increasing (digit length 110 + 2m in definition (1))"
      lean: "LychrelBase6.xValue_strictMono"
      module: "Challenge"
      status: proved
      note: "StrictMono xValue."
    - source: "Section 1: the decimal value of the smallest Family 1 seed x(0) (86 digits)"
      lean: "LychrelBase6.xValue_zero_eq"
      module: "Challenge"
      status: proved
      note: "Exact natural-number identity for x(0)."
    - source: "Corollary 3, Family y(m): every y(m) is a base-6 Lychrel number"
      lean: "LychrelBase6.yValue_lychrel"
      module: "Challenge"
      status: proved
      note: "Compared without Corollary 3's positivity clause and its form for every forward iterate of the six seeds."
    - source: "Theorem 2: T^12(y(m)) = y(m + 3) for every m >= 0"
      lean: "LychrelBase6.yValue_step12"
      module: "Challenge"
      status: proved
      note: "The period-12 return of Theorem 2; its non-palindromicity half follows from LychrelBase6.yValue_lychrel."
    - source: "Family y(m) is strictly increasing (digit length 108 + 2m in definition (2))"
      lean: "LychrelBase6.yValue_strictMono"
      module: "Challenge"
      status: proved
      note: "StrictMono yValue."
    - source: "Section 1: the decimal value of the smallest Family 2 seed y(0) (84 digits)"
      lean: "LychrelBase6.yValue_zero_eq"
      module: "Challenge"
      status: proved
      note: "Exact natural-number identity for y(0)."
    - source: "The families x(m) and y(m) are disjoint (abstract; part of Theorem 7)"
      lean: "LychrelBase6.xValue_disjoint_yValue"
      module: "Challenge"
      status: proved
      note: "x(m) != y(n) for all m and n; Theorem 7's injectivity of all six forward trajectories is in the Lean library but not compared."
