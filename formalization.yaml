status:
  scope: >-
    Complete unconditional proof of the existence of infinitely many base-6
    Lychrel numbers via both explicit period-12 families x(m) and y(m),
    including the carry-automaton soundness engine (Lemma C and Lemma S),
    direct kernel verification for small indices m in {0..5}, strict
    monotonicity, pairwise disjointness, exact base-10 seed identities, and
    complement duality/orbit structure in LychrelBase6.DualityAndCounting.
    Does not resolve whether smaller base-6 Lychrel suspects (such as the
    smallest conjectured base-6 seed) are Lychrel.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Quot.sound"
    - "Classical.choice"

